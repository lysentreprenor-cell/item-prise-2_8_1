name: Build Android APK

on:
  push:
    branches: [main, master, ccr-20ea6eac-u8dhrb]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # arm64-only + minification keeps the APK small enough to download reliably on mobile
      - name: Configure APK size reduction
        working-directory: android
        run: |
          sed -i '/^reactNativeArchitectures=/d' gradle.properties
          cat >> gradle.properties <<'EOF'
          reactNativeArchitectures=arm64-v8a
          android.enableMinifyInReleaseBuilds=true
          android.enableProguardInReleaseBuilds=true
          android.enableShrinkResourcesInReleaseBuilds=true
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ItemPrise-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ItemPrise-apk
          path: ItemPrise-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: ItemPrise APK (build ${{ github.run_number }})
          prerelease: true
          files: ItemPrise-*.apk
